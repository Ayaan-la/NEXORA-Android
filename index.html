<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Realistic 3D Solar System</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000000; font-family: sans-serif; color: #00f3ff; }
        canvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; background: rgba(0, 0, 0, 0.85); padding: 10px; border: 1px solid #ffaa00; border-radius: 8px; box-shadow: 0 0 15px rgba(255,170,0,0.3); max-width: 260px; margin: 0 auto; text-align: center; }
        h1 { font-size: 12px; margin: 0; text-transform: uppercase; letter-spacing: 2px; color: #ffaa00; }
        #instructions { position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: 10px; opacity: 0.85; background: rgba(0,0,0,0.8); padding: 6px; border-radius: 5px; border: 1px solid #333; text-align: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>Realistic Solar System</h1>
    </div>
    <div id="instructions">👉 আঙুল দিয়ে ড্র্যাগ করে গ্রহগুলো কাছে থেকে দেখুন</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 40, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 400;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xffffff, 2.5, 600, 0.5);
        scene.add(sunLight);

        // Starfield (মহাশূন্যের তারা)
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPos = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 1200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.0, transparent: true, opacity: 0.8 });
        scene.add(new THREE.Points(starsGeo, starsMat));

        // Function to create procedural realistic textures using HTML5 Canvas
        function createPlanetTexture(type, color1, color2) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            if (type === 'sun') {
                const gradient = ctx.createLinearGradient(0, 0, 0, 256);
                gradient.addColorStop(0, '#ffcc00');
                gradient.addColorStop(0.5, '#ff3300');
                gradient.addColorStop(1, '#ff6600');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 512, 256);
                // Add solar flares/spots
                for(let i=0; i<100; i++) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#ff9900';
                    ctx.fillRect(Math.random()*512, Math.random()*256, Math.random()*15, Math.random()*15);
                }
            } else if (type === 'jupiter') {
                ctx.fillStyle = color1;
                ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = color2;
                for(let i=0; i<20; i++) {
                    ctx.fillRect(0, Math.random()*256, 512, Math.random()*12);
                }
            } else if (type === 'earth') {
                ctx.fillStyle = '#114488'; // Ocean
                ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = '#228833'; // Land
                for(let i=0; i<30; i++) {
                    ctx.beginPath();
                    ctx.arc(Math.random()*512, Math.random()*256, Math.random()*40 + 10, 0, Math.PI*2);
                    ctx.fill();
                }
            } else {
                ctx.fillStyle = color1;
                ctx.fillRect(0, 0, 512, 256);
                ctx.fillStyle = color2;
                for(let i=0; i<50; i++) {
                    ctx.fillRect(Math.random()*512, Math.random()*256, Math.random()*8, Math.random()*8);
                }
            }
            return new THREE.CanvasTexture(canvas);
        }

        // Sun with glowing shader/texture
        const sunGeo = new THREE.SphereGeometry(6, 32, 32);
        const sunMat = new THREE.MeshBasicMaterial({ map: createPlanetTexture('sun') });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        scene.add(sun);

        // Sun Corona / Glow
        const glowGeo = new THREE.SphereGeometry(6.8, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.35, side: THREE.BackSide });
        scene.add(new THREE.Mesh(glowGeo, glowMat));

        // Planets Data
        const planetData = [
            { name: "Mercury", radius: 0.7, distance: 11, speed: 0.035, type: 'rock', c1: '#888888', c2: '#555555' },
            { name: "Venus", radius: 1.2, distance: 17, speed: 0.02, type: 'rock', c1: '#e3bb76', c2: '#a67c37' },
            { name: "Earth", radius: 1.4, distance: 24, speed: 0.012, type: 'earth', c1: '#114488', c2: '#228833' },
            { name: "Mars", radius: 0.9, distance: 31, speed: 0.009, type: 'rock', c1: '#cc4400', c2: '#882200' },
            { name: "Jupiter", radius: 3.2, distance: 44, speed: 0.005, type: 'jupiter', c1: '#d4a373', c2: '#bc6c25' },
            { name: "Saturn", radius: 2.6, distance: 58, speed: 0.0035, type: 'jupiter', c1: '#f4e2bb', c2: '#c2b280', hasRing: true },
            { name: "Uranus", radius: 1.8, distance: 70, speed: 0.002, type: 'rock', c1: '#77ddff', c2: '#3388bb' },
            { name: "Neptune", radius: 1.7, distance: 82, speed: 0.0012, type: 'rock', c1: '#3333cc', c2: '#111188' }
        ];

        const planets = [];

        planetData.forEach(data => {
            // Orbit ring line
            const orbitGeo = new THREE.BufferGeometry();
            const points = [];
            for (let i = 0; i <= 96; i++) {
                const theta = (i / 96) * Math.PI * 2;
                points.push(new THREE.Vector3(Math.cos(theta) * data.distance, 0, Math.sin(theta) * data.distance));
            }
            orbitGeo.setFromPoints(points);
            const orbitLine = new THREE.Line(orbitGeo, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.12 }));
            scene.add(orbitLine);

            // Planet Mesh with textured material
            const planetGeo = new THREE.SphereGeometry(data.radius, 32, 32);
            const planetMat = new THREE.MeshStandardMaterial({ 
                map: createPlanetTexture(data.type, data.c1, data.c2),
                roughness: 0.8,
                metalness: 0.1
            });
            const planet = new THREE.Mesh(planetGeo, planetMat);

            // Saturn Rings
            if (data.hasRing) {
                const ringGeo = new THREE.RingGeometry(data.radius + 0.8, data.radius + 2.4, 32);
                ringGeo.rotateX(Math.PI / 2);
                const ringMat = new THREE.MeshStandardMaterial({ color: 0xd4b572, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                planet.add(ring);
            }

            scene.add(planet);
            planets.push({ mesh: planet, distance: data.distance, speed: data.speed, angle: Math.random() * Math.PI * 2 });
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            sun.rotation.y += 0.003;

            planets.forEach(p => {
                p.angle += p.speed;
                p.mesh.position.x = Math.cos(p.angle) * p.distance;
                p.mesh.position.z = Math.sin(p.angle) * p.distance;
                p.mesh.rotation.y += 0.015;
            });

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
