<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Sports Car Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050b14; font-family: sans-serif; color: #00f3ff; }
        canvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; background: rgba(5, 11, 20, 0.9); padding: 12px; border: 1px solid #00f3ff; border-radius: 8px; box-shadow: 0 0 15px rgba(0,243,255,0.3); max-width: 300px; margin: 0 auto; text-align: center; }
        h1 { font-size: 13px; margin: 0 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }
        #loading { font-size: 12px; color: #ffaa00; margin-top: 5px; }
        #instructions { position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: 11px; opacity: 0.85; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 5px; border: 1px solid #113355; text-align: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>3D Sports Car</h1>
        <div id="loading">লোডিং হচ্ছে, একটু অপেক্ষা করুন...</div>
    </div>
    <div id="instructions">👉 আঙুল দিয়ে ড্র্যাগ করে গাড়ি ঘুরিয়ে দেখুন | জুম ইন/আউট করুন</div>

    <!-- Three.js & GLTFLoader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);
        scene.fog = new THREE.FogExp2(0x050b14, 0.02);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 2, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Prevent camera going below ground

        const gridHelper = new THREE.GridHelper(50, 50, 0x00f3ff, 0x113355);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00f3ff, 2.0);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const pointLight = new THREE.PointLight(0xffaa00, 2, 50);
        pointLight.position.set(-10, 5, -10);
        scene.add(pointLight);

        // Load Real 3D Car Model
        const loader = new THREE.GLTFLoader();
        // Using a standard open-source low-poly car model from Three.js examples
        loader.load(
            'https://threejs.org/examples/models/gltf/Ferrari.glb',
            function (gltf) {
                const car = gltf.scene;
                car.position.set(0, -0.5, 0);
                car.scale.set(0.8, 0.8, 0.8);
                scene.add(car);
                
                document.getElementById('loading').innerText = 'লোড সফল হয়েছে!';
                setTimeout(() => {
                    document.getElementById('loading').style.display = 'none';
                }, 2000);
            },
            function (xhr) {
                let percent = Math.floor((xhr.loaded / xhr.total) * 100);
                if(percent) document.getElementById('loading').innerText = `লোড হচ্ছে: ${percent}%`;
            },
            function (error) {
                console.error(error);
                document.getElementById('loading').innerText = 'মডেল লোড করতে সমস্যা হয়েছে!';
            }
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
