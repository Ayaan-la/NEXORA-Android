<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BMW M4 3D Blueprint & Engine Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050b14; font-family: sans-serif; color: #00f3ff; }
        canvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 10; background: rgba(5, 11, 20, 0.9); padding: 12px; border: 1px solid #00f3ff; border-radius: 8px; box-shadow: 0 0 15px rgba(0,243,255,0.3); max-width: 300px; margin: 0 auto; }
        h1 { font-size: 13px; margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        button { background: transparent; color: #00f3ff; border: 1px solid #00f3ff; padding: 6px 10px; margin: 4px 0; cursor: pointer; border-radius: 4px; display: block; width: 100%; font-weight: bold; font-size: 12px; }
        button:active { background: #00f3ff; color: #050b14; }
        #instructions { position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: 11px; opacity: 0.85; background: rgba(0,0,0,0.8); padding: 8px; border-radius: 5px; border: 1px solid #113355; text-align: center; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>BMW M4 Blueprint</h1>
        <button id="explodeBtn">Toggle Exploded View (আলাদা করা)</button>
        <button id="engineBtn">Toggle Engine Working (ইঞ্জিন চালু)</button>
        <button id="wireframeBtn">Toggle Wireframe (ব্লুপ্রিন্ট)</button>
    </div>
    <div id="instructions">👉 আঙুল দিয়ে ড্র্যাগ করে ঘুরিয়ে দেখুন | জুম করুন</div>

    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b14);
        scene.fog = new THREE.FogExp2(0x050b14, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(16, 9, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const gridHelper = new THREE.GridHelper(60, 60, 0x00f3ff, 0x113355);
        gridHelper.position.y = -1;
        scene.add(gridHelper);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0x00f3ff, 0.9);
        directionalLight.position.set(10, 25, 10);
        scene.add(directionalLight);

        const blueprintMaterial = new THREE.MeshStandardMaterial({
            color: 0x00f3ff,
            wireframe: true,
            roughness: 0.2,
            metalness: 0.8
        });

        const solidBlueprintMaterial = new THREE.MeshStandardMaterial({
            color: 0x0a2240,
            emissive: 0x002244,
            roughness: 0.4,
            metalness: 0.6,
            wireframe: false
        });

        const engineMaterial = new THREE.MeshStandardMaterial({
            color: 0xffaa00,
            roughness: 0.3,
            metalness: 0.9
        });

        const pistonMaterial = new THREE.MeshStandardMaterial({
            color: 0x00ff88,
            metalness: 0.9
        });

        const carGroup = new THREE.Group();
        scene.add(carGroup);

        const bodyGeometry = new THREE.BoxGeometry(7.2, 1.8, 3.2);
        const bodyMesh = new THREE.Mesh(bodyGeometry, solidBlueprintMaterial);
        bodyMesh.position.set(0, 0.6, 0);
        carGroup.add(bodyMesh);

        const cabinGeometry = new THREE.BoxGeometry(3.6, 1.2, 2.8);
        const cabinMesh = new THREE.Mesh(cabinGeometry, blueprintMaterial);
        cabinMesh.position.set(-0.2, 1.8, 0);
        carGroup.add(cabinMesh);

        const grilleGeo = new THREE.BoxGeometry(0.2, 0.8, 1.2);
        const grilleMesh = new THREE.Mesh(grilleGeo, pistonMaterial);
        grilleMesh.position.set(3.61, 0.5, 0);
        carGroup.add(grilleMesh);

        const wheels = [];
        const wheelGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.6, 24);
        wheelGeo.rotateX(Math.PI / 2);

        const wheelPositions = [
            { x: 2.2, y: -0.2, z: 1.7 },   
            { x: 2.2, y: -0.2, z: -1.7 },  
            { x: -2.2, y: -0.2, z: 1.7 },  
            { x: -2.2, y: -0.2, z: -1.7 }   
        ];

        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, blueprintMaterial);
            wheel.position.set(pos.x, pos.y, pos.z);
            carGroup.add(wheel);
            wheels.push(wheel);
        });

        const engineGroup = new THREE.Group();
        engineGroup.position.set(1.8, 0.8, 0);
        carGroup.add(engineGroup);

        const blockGeo = new THREE.BoxGeometry(1.8, 1.0, 1.6);
        const blockMesh = new THREE.Mesh(blockGeo, engineMaterial);
        engineGroup.add(blockMesh);

        const pistons = [];
        for (let i = -0.5; i <= 0.5; i += 0.5) {
            const pistonGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.8, 16);
            const piston = new THREE.Mesh(pistonGeo, pistonMaterial);
            piston.position.set(i, 0.7, 0);
            engineGroup.add(piston);
            pistons.push(piston);
        }

        let isExploded = false;
        let isEngineRunning = false;
        let wireframeMode = true;

        document.getElementById('explodeBtn').addEventListener('click', () => {
            isExploded = !isExploded;
            const targetCabinY = isExploded ? 3.2 : 1.8;
            const targetEngineX = isExploded ? 3.2 : 1.8;
            const targetWheelsZ = isExploded ? 2.6 : 1.7;

            let progress = 0;
            function animateExplode() {
                progress += 0.05;
                cabinMesh.position.y = THREE.MathUtils.lerp(cabinMesh.position.y, targetCabinY, 0.1);
                engineGroup.position.x = THREE.MathUtils.lerp(engineGroup.position.x, targetEngineX, 0.1);
                
                wheels[0].position.z = THREE.MathUtils.lerp(wheels[0].position.z, targetWheelsZ, 0.1);
                wheels[1].position.z = THREE.MathUtils.lerp(wheels[1].position.z, -targetWheelsZ, 0.1);
                wheels[2].position.z = THREE.MathUtils.lerp(wheels[2].position.z, targetWheelsZ, 0.1);
                wheels[3].position.z = THREE.MathUtils.lerp(wheels[3].position.z, -targetWheelsZ, 0.1);

                if (progress < 1) requestAnimationFrame(animateExplode);
            }
            animateExplode();
        });

        document.getElementById('engineBtn').addEventListener('click', () => {
            isEngineRunning = !isEngineRunning;
            document.getElementById('engineBtn').style.background = isEngineRunning ? '#00f3ff' : 'transparent';
            document.getElementById('engineBtn').style.color = isEngineRunning ? '#050b14' : '#00f3ff';
        });

        document.getElementById('wireframeBtn').addEventListener('click', () => {
            wireframeMode = !wireframeMode;
            blueprintMaterial.wireframe = wireframeMode;
            solidBlueprintMaterial.wireframe = wireframeMode;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (isEngineRunning) {
                pistons.forEach((piston, index) => {
                    piston.position.y = 0.7 + Math.sin(elapsedTime * 18 + index) * 0.35;
                });
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
